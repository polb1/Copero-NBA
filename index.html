<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="description" content="NBA Legacy: simulador de carrera profesional de baloncesto. Crea tu jugador, vive el draft y construye un legado." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff6b1a'/%3E%3Cpath d='M2 32h60M32 2v60M12 10c10 10 10 34 0 44M52 10c-10 10-10 34 0 44' stroke='%230b0c0e' stroke-width='3' fill='none'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint: on a slow phone network the game must show up right away. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <meta property="og:title" content="NBA Legacy" />
    <meta property="og:description" content="Crea tu jugador, vive el draft y construye una carrera irrepetible en este simulador de baloncesto." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>NBA Legacy</title>
  </head>
  <body>
    <!-- Instant splash while the game downloads (React replaces it). If it never starts, say so instead of a black screen. -->
    <div id="root"><div id="splash" style="min-height:100vh;display:grid;place-items:center;background:#0b0c0e;color:#b0b6c1;font:15px system-ui,-apple-system,sans-serif;text-align:center">
      <div><div style="font-size:42px;animation:sb .6s ease-in-out infinite alternate">🏀</div><div style="margin-top:10px;font-weight:700;color:#f4f5f7;letter-spacing:.06em">NBA LEGACY</div><div id="splash-msg" style="margin-top:6px">Cargando…</div></div>
    </div></div>
    <style>@keyframes sb{to{transform:translateY(-12px)}}</style>
    <script>
      // A script error before the game mounts (very old browser, blocked file) gets an explanation, not silence.
      window.addEventListener('error', function () {
        var m = document.getElementById('splash-msg');
        if (m) m.innerHTML = 'Tu navegador no pudo iniciar el juego.<br>Actualízalo o ábrelo en Safari o Chrome.';
      });
      setTimeout(function () {
        var m = document.getElementById('splash-msg');
        if (m) m.innerHTML = 'Está tardando más de lo normal.<br><button onclick="location.reload()" style="margin-top:12px;padding:10px 18px;border-radius:999px;border:0;background:#ff6b1a;color:#fff;font-weight:700">Recargar</button>';
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
